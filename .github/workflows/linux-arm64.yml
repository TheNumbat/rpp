name: Linux (aarch64)
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install aarch64 Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user
    - name: Install Clang 23
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
        sudo bash llvm.sh 23
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRPP_TEST=ON -DRPP_QEMU=ON
      env:
        CXX: clang++-23 --target=aarch64-linux-gnu
        CXXFLAGS: -march=armv8-a
        AR: aarch64-linux-gnu-ar
        AS: aarch64-linux-gnu-as
        LD: aarch64-linux-gnu-ld
        STRIP: aarch64-linux-gnu-strip
    - name: Build
      run: cmake --build build -- -j
    - name: Test
      run: ctest --test-dir build --output-on-failure

name: macOS (aarch64)
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Clang 23
      run: |
        brew install --force-bottle llvm@23
        echo "CXX=$(brew --prefix llvm@23)/bin/clang++" >> "$GITHUB_ENV"
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRPP_TEST=ON
    - name: Build
      run: cmake --build build -- -j
    - name: Test
      run: ctest --test-dir build --output-on-failure

name: macOS
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select preinstalled Clang 18
      run: |
        compiler="$(brew --prefix llvm@18)/bin/clang++"
        "$compiler" --version
        echo "CXX=$compiler" >> "$GITHUB_ENV"
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRPP_TEST=ON
    - name: Build
      run: cmake --build build -- -j
    - name: Test
      run: ctest --test-dir build --output-on-failure

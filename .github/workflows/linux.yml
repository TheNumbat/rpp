name: Linux
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Clang 23
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
        sudo bash llvm.sh 23
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRPP_TEST=ON
      env:
        CXX: clang++-23
    - name: Build
      run: cmake --build build -- -j
    - name: Test
      run: ctest --test-dir build --output-on-failure
